trigger:
- main

variables:
- group: deploy-credentials   # configure DEPLOY_USER + DEPLOY_PASSWORD in your CI secret store

- name: buildConfiguration
  value: 'Release'

- name: publishFolder
  value: '$(Build.ArtifactStagingDirectory)\publish'

- name: zipFile
  value: '$(Build.ArtifactStagingDirectory)\package.zip'


stages:

# =====================================================
# BUILD STAGE
# =====================================================
- stage: Build
  displayName: Build
  jobs:
  - job: BuildJob
    pool:
      vmImage: 'windows-latest'

    steps:

    - checkout: self

    - task: UseDotNet@2
      displayName: Install .NET 8 SDK
      inputs:
        packageType: sdk
        version: 8.x

    # Clean publish folder (cực quan trọng)
    - powershell: |
        if (Test-Path "$(publishFolder)") {
            Remove-Item "$(publishFolder)" -Recurse -Force
        }
      displayName: Clean publish folder

    # Tìm đúng Web project (project có Microsoft.NET.Sdk.Web)
    - powershell: |
        $proj = Get-ChildItem -Recurse -Filter *.csproj | 
                Where-Object { Select-String -Path $_.FullName -Pattern "Microsoft.NET.Sdk.Web" -Quiet } |
                Select-Object -First 1

        if (-not $proj) {
            Write-Error "No Web project found!"
            exit 1
        }

        Write-Host "Found web project:" $proj.FullName
        Write-Host "##vso[task.setvariable variable=WebProjectPath]$($proj.FullName)"
      displayName: Detect Web Project

    # Restore
    - task: DotNetCoreCLI@2
      displayName: Restore
      inputs:
        command: restore
        projects: '$(WebProjectPath)'

    # Publish (xuất thẳng vào publishFolder)
    - task: DotNetCoreCLI@2
      displayName: Publish
      inputs:
        command: publish
        projects: '$(WebProjectPath)'
        arguments: '--configuration $(buildConfiguration) --output "$(publishFolder)"'
        zipAfterPublish: false
        modifyOutputPath: false

    # Debug để chắc chắn KHÔNG có folder s
    - powershell: |
        Write-Host "===== PUBLISH FOLDER STRUCTURE ====="
        Get-ChildItem "$(publishFolder)"
      displayName: Verify publish output

    # Zip đúng level (KHÔNG include root folder)
    - task: ArchiveFiles@2
      displayName: Create package.zip
      inputs:
        rootFolderOrFile: '$(publishFolder)'
        includeRootFolder: false
        archiveType: zip
        archiveFile: '$(zipFile)'
        replaceExistingArchive: true

    - publish: $(zipFile)
      artifact: drop



# =====================================================
# DEPLOY STAGE
# =====================================================
- stage: Deploy
  displayName: Deploy to IIS
  dependsOn: Build
  jobs:
  - job: DeployJob
    pool:
      vmImage: 'windows-latest'

    steps:

    - download: current
      artifact: drop

    - task: PowerShell@2
      displayName: Deploy via MSDeploy
      inputs:
        targetType: inline
        script: |

          $ErrorActionPreference = "Stop"
          $msdeploy = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"

          Write-Host "===================================="
          Write-Host "Starting deployment..."
          Write-Host "===================================="

          $arguments = @(
            "-verb:sync",
            "-source:package=$(Pipeline.Workspace)\drop\package.zip",
            "-dest:contentPath=YOUR_IIS_SITE,computerName=https://YOUR_IIS_HOST:8172/msdeploy.axd?site=YOUR_IIS_SITE,userName=$(DEPLOY_USER),password=$(DEPLOY_PASSWORD),authType=Basic",
            "-enableRule:AppOffline",
            "-allowUntrusted"
          )

          & $msdeploy $arguments

          if ($LASTEXITCODE -ne 0) {
              throw "MSDeploy failed with exit code $LASTEXITCODE"
          }

          Write-Host "===================================="
          Write-Host "Deployment completed successfully!"
          Write-Host "===================================="